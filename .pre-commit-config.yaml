# Pre-commit hooks — https://pre-commit.com
# Setup:  pip install pre-commit && pre-commit install
# Run on everything:  pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json                 # manifest.json etc. must parse
      - id: check-added-large-files    # exports/media don't belong in the repo
        args: [--maxkb=1024]
      - id: detect-private-key         # PEM / SSH key material
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: js-syntax
        name: JS syntax check (ES modules, node --check)
        entry: bash -c 'for f in "$@"; do node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }; done' --
        language: system
        files: \.js$

      - id: forbid-archive-exports
        name: Block personal archive exports & env files
        entry: Personal archive exports / env files must not be committed
        language: fail
        files: ^(.*/)?(threads-archive-.*|.*\.zip|.*\.tar\.gz|\.env(\..*)?|.*\.pem|.*\.key)$
        exclude: ^\.env\.example$

      - id: forbid-credentials
        name: Forbid credential-looking strings
        language: pygrep
        entry: (?i)(api[_-]?key|access[_-]?token|client[_-]?secret)[\s"':=]+[A-Za-z0-9_-]{12,}|xox[baprs]-[A-Za-z0-9-]{10,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}
        types: [text]

      - id: forbid-live-session-tokens
        name: Forbid live Threads session/cookie values
        language: pygrep
        entry: ds_user_id=[0-9]{5,}|csrftoken=[A-Za-z0-9]{10,}|"lsd"\s*:\s*"[A-Za-z0-9_-]{10,}"
        types: [text]
        files: \.(js|html)$
