<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threads Archiver</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0d0d;
      --surface:     #1a1a1a;
      --border:      #2e2e2e;
      --text:        #f0ece8;
      --muted:       #8a8a8a;
      --accent:      #0095f6;
      --danger:      #e74c3c;
      --green:       #2ecc71;
      --radius:      10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 360px;
      min-height: 200px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }
    .sync-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
    }
    .sync-btn:disabled { opacity: .5; cursor: default; }
    .sync-btn.secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .sync-btn.secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    /* ── status bar ── */
    .status-bar {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
    .status-dot.error   { background: var(--danger); }
    .status-dot.auth_error { background: var(--danger); }
    .status-dot.idle    { background: var(--green); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .status-stats {
      margin-left: auto;
      font-size: 11px;
      color: var(--muted);
    }

    /* ── toolbar (search + sort) ── */
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      padding: 6px 10px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .sort-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      padding: 6px 6px;
      outline: none;
      cursor: pointer;
      max-width: 150px;
    }

    .media-warning { color: #e8c96a; }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn:hover { border-color: #e8c96a; }
    .filter-btn.active {
      border-color: #e8c96a;
      color: #e8c96a;
      background: rgba(232, 201, 106, .08);
    }

    .thread-item.has-missing {
      box-shadow: inset 3px 0 0 #e8c96a;
    }

    .list-empty-note {
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── thread list ── */
    .thread-list {
      overflow-y: auto;
      flex: 1;
    }
    .thread-list:empty::after {
      content: "No archived threads yet.\ASync to get started.";
      white-space: pre;
      display: block;
      padding: 32px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .thread-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .thread-item:hover { background: var(--surface); }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }
    .avatar-placeholder {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: var(--muted);
    }

    .thread-body { flex: 1; min-width: 0; }
    .thread-meta {
      display: flex; align-items: baseline; gap: 6px;
      margin-bottom: 3px;
    }
    .thread-name {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-handle {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .thread-date {
      font-size: 11px; color: var(--muted); margin-left: auto; flex-shrink: 0;
    }
    .thread-text {
      font-size: 13px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }
    .thread-stats {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
      display: flex; gap: 12px;
    }
    .has-replies::before {
      content: "💬 ";
    }

    /* ── footer (export / import) ── */
    .footer {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
    }
    .footer-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 11px;
      padding: 6px 8px;
      cursor: pointer;
    }
    .footer-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .footer-btn:disabled { opacity: .5; cursor: default; }

    /* ── auth banner ── */
    .auth-banner {
      margin: 12px 16px;
      padding: 12px;
      background: #2a1515;
      border: 1px solid var(--danger);
      border-radius: var(--radius);
      font-size: 12px;
      line-height: 1.5;
    }
    .auth-banner a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Threads Archiver</h1>
    <button class="sync-btn secondary" id="openArchiveBtn"
            title="Browse all saves in a full-tab timeline">⧉</button>
    <button class="sync-btn secondary" id="fullRefreshBtn"
            title="Re-fetch details for ALL archived posts: user icons, missing media, video posters, reply counts. One request per post — can take a while.">⟳ Full refresh</button>
    <button class="sync-btn" id="syncBtn">Sync now</button>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Loading…</span>
    <span class="status-stats" id="statsText"></span>
  </div>

  <div class="toolbar">
    <input class="search-input" id="searchInput" type="search"
           placeholder="Search text, @user, replies…" autocomplete="off">
    <select class="sort-select" id="sortSelect" title="Sort order">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="updated">Recently updated</option>
      <option value="archived">Recently archived</option>
    </select>
    <button class="filter-btn" id="missingFilter"
            title="Show only threads with missing media">⚠</button>
  </div>

  <div class="thread-list" id="threadList"></div>

  <div class="footer">
    <button class="footer-btn" id="exportBtn"
            title="Download a self-contained .zip: media files, a standalone viewer (index.html), and the local API — shareable and viewable anywhere">⤓ Export .zip</button>
    <button class="footer-btn" id="importBtn"
            title="Restore an exported .zip (or legacy .json) into this browser">⤒ Import</button>
    <input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" style="display:none">
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
